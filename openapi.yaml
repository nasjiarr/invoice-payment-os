openapi: 3.1.0
info:
  title: Invoice & Payment OS REST API
  description: |
    Production-ready REST API documentation for Invoice & Payment OS.
    Features robust multi-tenant workspace isolation, zero-trust price calculations,
    idempotent webhook processing, payment gateway abstraction, and revenue reports.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8000
    description: Local Development Server
  - url: http://invoice-payment-os.test
    description: Laragon Local Virtual Host

tags:
  - name: Authentication
    description: User registration, Sanctum token issue, session retrieval, and token revocation.
  - name: Business
    description: Workspace management and multi-tenant isolation.
  - name: Customers
    description: Customer directory scoped to workspaces.
  - name: Products
    description: Service/product catalog with fixed-point decimal precision.
  - name: Invoices
    description: Invoice lifecycle engine, immutable line item snapshots, transitions, and PDF rendering.
  - name: Payments
    description: Payment ledger, partial payments, gateway synchronization, cancellation, and refunds.
  - name: Webhooks
    description: Idempotent external payment gateway event ingest with race condition protection.
  - name: Reports
    description: Database-aggregated financial metrics (invoiced, paid, outstanding, overdue).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token
      description: Enter your personal access token returned by `/api/login` or `/api/register`.

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Business:
      type: object
      properties:
        id:
          type: integer
          example: 1
        owner_id:
          type: integer
          example: 1
        name:
          type: string
          example: Nasjiar Web Studio
        email:
          type: string
          format: email
          example: studio@nasjiar.com
        phone:
          type: string
          example: "+628123456789"
        address:
          type: string
          example: Jl. Merdeka No. 45, Bandung
        tax_id:
          type: string
          example: "01.234.567.8-901.000"
        currency:
          type: string
          example: IDR
        role:
          type: string
          example: owner
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        business_id:
          type: integer
          example: 1
        name:
          type: string
          example: Acme Corporation
        email:
          type: string
          format: email
          example: billing@acme.corp
        phone:
          type: string
          example: "+628987654321"
        address:
          type: string
          example: Cyber 2 Tower, Jakarta Selatan
        notes:
          type: string
          nullable: true
          example: Enterprise SLA client
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        business_id:
          type: integer
          example: 1
        name:
          type: string
          example: Web Application Development
        description:
          type: string
          example: Custom Laravel backend & Tailwind frontend
        price:
          type: string
          example: "7500000.00"
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InvoiceItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        invoice_id:
          type: integer
          example: 1
        product_id:
          type: integer
          nullable: true
          example: 1
        description:
          type: string
          example: Custom Laravel API Development
        quantity:
          type: string
          example: "1.00"
        unit_price:
          type: string
          example: "5000000.00"
        discount:
          type: string
          example: "500000.00"
        tax:
          type: string
          example: "495000.00"
        subtotal:
          type: string
          example: "5000000.00"
        total:
          type: string
          example: "4995000.00"

    Invoice:
      type: object
      properties:
        id:
          type: integer
          example: 1
        business_id:
          type: integer
          example: 1
        customer_id:
          type: integer
          example: 1
        invoice_number:
          type: string
          example: INV-20260928-1001
        status:
          type: string
          enum: [draft, sent, partially_paid, paid, void, cancelled]
          example: sent
        issue_date:
          type: string
          format: date
          example: "2026-09-28"
        due_date:
          type: string
          format: date
          example: "2026-10-12"
        currency:
          type: string
          example: IDR
        subtotal:
          type: string
          example: "5000000.00"
        discount:
          type: string
          example: "500000.00"
        tax:
          type: string
          example: "495000.00"
        total:
          type: string
          example: "4995000.00"
        notes:
          type: string
          nullable: true
          example: Bank BCA 1234567890 a.n Nasjiar
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        business_id:
          type: integer
          example: 1
        invoice_id:
          type: integer
          example: 1
        amount:
          type: string
          example: "4995000.00"
        currency:
          type: string
          example: IDR
        status:
          type: string
          enum: [pending, paid, failed, cancelled, refunded]
          example: paid
        payment_method:
          type: string
          example: bank_transfer
        transaction_id:
          type: string
          example: TRX-20260928-89218291
        paid_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RevenueReport:
      type: object
      properties:
        total_invoices:
          type: integer
          example: 15
        total_invoice:
          type: integer
          example: 15
        total_invoiced:
          type: string
          example: "75000000.00"
        total_paid:
          type: string
          example: "50000000.00"
        total_outstanding:
          type: string
          example: "25000000.00"
        total_overdue:
          type: string
          example: "5000000.00"
        currency:
          type: string
          example: IDR

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    GeneralError:
      type: object
      properties:
        message:
          type: string
          example: This action is unauthorized.

paths:
  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /api/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      description: Creates a user account with hashed password and generates an initial Sanctum personal access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: P@ssw0rd123!
                password_confirmation:
                  type: string
                  format: password
                  example: P@ssw0rd123!
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              example:
                message: User registered successfully
                data:
                  user:
                    id: 1
                    name: Jane Doe
                    email: jane@example.com
                  token: 1|abcdef123456...
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/login:
    post:
      tags: [Authentication]
      summary: Login user & generate Sanctum token
      description: Authenticates user credentials and issues a new Sanctum Bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  format: password
                  example: P@ssw0rd123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              example:
                message: Login successful
                data:
                  user:
                    id: 1
                    name: Jane Doe
                    email: jane@example.com
                  token: 2|xyz987654321...
        '422':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/user:
    get:
      tags: [Authentication]
      summary: Get authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              example:
                data:
                  id: 1
                  name: Jane Doe
                  email: jane@example.com
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'

  /api/logout:
    post:
      tags: [Authentication]
      summary: Revoke current Sanctum access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              example:
                message: Logged out successfully

  # ==========================================
  # BUSINESS / WORKSPACE
  # ==========================================
  /api/business:
    get:
      tags: [Business]
      summary: List user businesses / workspaces
      description: Returns all businesses where the authenticated user is owner or authorized member.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of accessible businesses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Business'
    post:
      tags: [Business]
      summary: Create a new business workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  example: Nasjiar Web Studio
                email:
                  type: string
                  format: email
                  example: studio@nasjiar.com
                phone:
                  type: string
                  example: "+628123456789"
                address:
                  type: string
                  example: Jl. Asia Afrika No. 10, Bandung
                tax_id:
                  type: string
                  example: "01.234.567.8-901.000"
                currency:
                  type: string
                  default: IDR
                  example: IDR
      responses:
        '201':
          description: Business created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'

  /api/business/{business}:
    get:
      tags: [Business]
      summary: Get business details
      security:
        - bearerAuth: []
      parameters:
        - name: business
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Business details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '403':
          description: Unauthorized access (IDOR protection)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
    put:
      tags: [Business]
      summary: Update business details
      security:
        - bearerAuth: []
      parameters:
        - name: business
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                address:
                  type: string
                tax_id:
                  type: string
                currency:
                  type: string
      responses:
        '200':
          description: Business updated successfully
    delete:
      tags: [Business]
      summary: Delete business workspace (Owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: business
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Business deleted successfully

  # ==========================================
  # CUSTOMERS
  # ==========================================
  /api/customers:
    get:
      tags: [Customers]
      summary: List customers with pagination & search
      security:
        - bearerAuth: []
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
        - name: search
          in: query
          description: Filter by customer name or email
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [id, name, email, created_at]
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Paginated customer list
    post:
      tags: [Customers]
      summary: Create customer in workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_id, name, email]
              properties:
                business_id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: PT Inovasi Digital Nusantara
                email:
                  type: string
                  format: email
                  example: finance@inovasi.id
                phone:
                  type: string
                  example: "+62811223344"
                address:
                  type: string
                  example: Menara Sudirman Lt. 12, Jakarta
                notes:
                  type: string
                  example: Monthly payment term
      responses:
        '201':
          description: Customer created

  /api/customers/{customer}:
    get:
      tags: [Customers]
      summary: Get customer details
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer details
        '403':
          description: Unauthorized access (IDOR protection)
    put:
      tags: [Customers]
      summary: Update customer details
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Customer updated
    delete:
      tags: [Customers]
      summary: Delete customer
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer deleted

  # ==========================================
  # PRODUCTS / SERVICES
  # ==========================================
  /api/products:
    get:
      tags: [Products]
      summary: List products / services
      security:
        - bearerAuth: []
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
        - name: active
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated product list
    post:
      tags: [Products]
      summary: Create product / service
      description: Price uses fixed-point decimal (15,2) to eliminate floating point rounding errors.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_id, name, price]
              properties:
                business_id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Dedicated Cloud Server Maintenance
                description:
                  type: string
                  example: Monthly DevOps 24/7 monitoring
                price:
                  type: number
                  format: float
                  minimum: 0
                  example: 2500000.00
                active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Product created successfully

  /api/products/{product}:
    get:
      tags: [Products]
      summary: Get product details
      security:
        - bearerAuth: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product details
    put:
      tags: [Products]
      summary: Update product / service
      description: Updating product price will NOT alter existing historical invoices.
      security:
        - bearerAuth: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                active:
                  type: boolean
      responses:
        '200':
          description: Product updated
    delete:
      tags: [Products]
      summary: Delete product
      security:
        - bearerAuth: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product deleted

  # ==========================================
  # INVOICES & INVOICE ITEMS
  # ==========================================
  /api/invoices:
    get:
      tags: [Invoices]
      summary: List invoices with filters & sorting
      security:
        - bearerAuth: []
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
        - name: customer_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, sent, partially_paid, paid, void, cancelled]
        - name: search
          in: query
          description: Search by invoice number or customer name
          schema:
            type: string
      responses:
        '200':
          description: Paginated invoices list
    post:
      tags: [Invoices]
      summary: Create new invoice with line item snapshots
      description: |
        Backend automatically calculates subtotal, discount, tax, and total.
        Frontend total values are NEVER blindly trusted.
        Item unit prices and descriptions are snapshotted permanently into `invoice_items`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_id, customer_id, issue_date, due_date, items]
              properties:
                business_id:
                  type: integer
                  example: 1
                customer_id:
                  type: integer
                  example: 1
                invoice_number:
                  type: string
                  description: Optional custom invoice number. Auto-generated if omitted.
                  example: INV-20260928-1001
                issue_date:
                  type: string
                  format: date
                  example: "2026-09-28"
                due_date:
                  type: string
                  format: date
                  example: "2026-10-12"
                currency:
                  type: string
                  default: IDR
                  example: IDR
                notes:
                  type: string
                  example: Pembayaran via Transfer Bank BCA
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [description, quantity, unit_price]
                    properties:
                      product_id:
                        type: integer
                        nullable: true
                        example: 1
                      description:
                        type: string
                        example: Website Redesign & SEO Optimization
                      quantity:
                        type: number
                        minimum: 0.01
                        example: 1
                      unit_price:
                        type: number
                        minimum: 0
                        example: 5000000.00
                      discount:
                        type: number
                        default: 0
                        example: 500000.00
                      tax:
                        type: number
                        default: 0
                        example: 495000.00
      responses:
        '201':
          description: Invoice created with calculated totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /api/invoices/{invoice}:
    get:
      tags: [Invoices]
      summary: Get invoice details & items
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detailed invoice object with items, customer, and business
    put:
      tags: [Invoices]
      summary: Update invoice (Draft status only)
      description: Once sent or paid, items cannot be edited to preserve accounting immutability.
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: integer
                issue_date:
                  type: string
                  format: date
                due_date:
                  type: string
                  format: date
                notes:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [description, quantity, unit_price]
                    properties:
                      product_id:
                        type: integer
                        nullable: true
                      description:
                        type: string
                      quantity:
                        type: number
                      unit_price:
                        type: number
                      discount:
                        type: number
                      tax:
                        type: number
      responses:
        '200':
          description: Invoice updated successfully
    delete:
      tags: [Invoices]
      summary: Delete invoice (Draft or Cancelled only)
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invoice deleted successfully

  /api/invoices/{invoice}/send:
    post:
      tags: [Invoices]
      summary: Mark invoice as Sent
      description: Transitions invoice status from draft to sent and logs audit entry.
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invoice marked as sent

  /api/invoices/{invoice}/void:
    post:
      tags: [Invoices]
      summary: Void an invoice
      description: Transitions sent or partially paid invoice to void status.
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invoice voided

  /api/invoices/{invoice}/cancel:
    post:
      tags: [Invoices]
      summary: Cancel a draft invoice
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invoice cancelled

  /api/invoices/{invoice}/pdf:
    get:
      tags: [Invoices]
      summary: Stream / Download invoice PDF
      description: Generates clean, professional PDF on-the-fly directly from database snapshot.
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: PDF binary stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ==========================================
  # PAYMENTS
  # ==========================================
  /api/invoices/{invoice}/payments:
    get:
      tags: [Payments]
      summary: List payments for an invoice
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of payment transactions for this invoice
    post:
      tags: [Payments]
      summary: Record payment for an invoice
      description: |
        Backend recalculates outstanding balance:
        - If paid < total: invoice status becomes `partially_paid`
        - If paid >= total: invoice status becomes `paid`
        Overpayments exceeding outstanding balance are rejected (HTTP 422).
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  example: 2500000.00
                currency:
                  type: string
                  example: IDR
                status:
                  type: string
                  enum: [pending, paid, failed, cancelled]
                  default: paid
                  example: paid
                payment_method:
                  type: string
                  example: qris
                transaction_id:
                  type: string
                  example: TRX-20260928-89218291
                notes:
                  type: string
                  example: Pelunasan termin 1
      responses:
        '201':
          description: Payment recorded and invoice status recalculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '422':
          description: Overpayment or validation error

  /api/payments/{payment}:
    get:
      tags: [Payments]
      summary: Get payment details
      security:
        - bearerAuth: []
      parameters:
        - name: payment
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payment transaction details

  /api/payments/{payment}/process:
    post:
      tags: [Payments]
      summary: Process pending payment to paid
      description: Idempotent - payments cannot be processed twice.
      security:
        - bearerAuth: []
      parameters:
        - name: payment
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payment processed to paid

  /api/payments/{payment}/cancel:
    post:
      tags: [Payments]
      summary: Cancel a pending payment
      security:
        - bearerAuth: []
      parameters:
        - name: payment
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pending payment marked as cancelled

  /api/payments/{payment}/refund:
    post:
      tags: [Payments]
      summary: Refund a paid payment
      description: Delegates refund to PaymentGatewayInterface and updates invoice status accordingly.
      security:
        - bearerAuth: []
      parameters:
        - name: payment
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  example: 500000.00
                reason:
                  type: string
                  example: Customer requested cancellation
      responses:
        '200':
          description: Payment refunded successfully

  /api/payments/{payment}/status:
    get:
      tags: [Payments]
      summary: Query latest status from payment gateway
      security:
        - bearerAuth: []
      parameters:
        - name: payment
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Realtime status from gateway provider

  # ==========================================
  # WEBHOOKS
  # ==========================================
  /api/webhooks/payment/{provider}:
    post:
      tags: [Webhooks]
      summary: Ingest external payment gateway webhook
      description: |
        Unauthenticated server-to-server webhook ingest.
        Protected by database-level unique constraint on `(provider, event_id)`
        preventing duplicate credit even under extreme concurrent arrivals.
        If an event previously failed, it is safely retryable.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Name of payment provider (e.g., midtrans, xendit, mock)
          schema:
            type: string
            example: mock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, event_type]
              properties:
                event_id:
                  type: string
                  example: evt_89218291
                event_type:
                  type: string
                  enum: [payment.success, payment.paid, settlement, capture, payment.failed, deny, cancel, expire, payment.refunded, refund]
                  example: payment.success
                transaction_id:
                  type: string
                  example: TRX-20260928-89218291
                data:
                  type: object
                  properties:
                    amount:
                      type: number
                      example: 4995000.00
                    status:
                      type: string
                      example: paid
      responses:
        '200':
          description: Webhook acknowledged (processed or duplicate skipped)
          content:
            application/json:
              examples:
                processed:
                  summary: First delivery processed
                  value:
                    status: processed
                    message: Webhook processed successfully
                    event_id: evt_89218291
                    provider: mock
                duplicate:
                  summary: Duplicate skipped safely
                  value:
                    status: duplicate
                    message: Duplicate webhook event detected, skipping
                    event_id: evt_89218291
                    provider: mock
        '404':
          description: Referenced transaction ID not found
        '422':
          description: Missing required fields or processing domain error

  # ==========================================
  # REPORTS
  # ==========================================
  /api/reports/revenue:
    get:
      tags: [Reports]
      summary: Financial revenue & receivables report
      description: |
        Calculates total invoiced, total paid, total outstanding, and total overdue
        using single aggregate SQL queries. Multi-tenant isolated to authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: date_from
          in: query
          description: Filter issue date from (inclusive, YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-09-01"
        - name: date_to
          in: query
          description: Filter issue date to (inclusive, YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-09-30"
        - name: customer_id
          in: query
          description: Filter metrics for a single customer
          schema:
            type: integer
            example: 1
        - name: payment_status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [draft, sent, partially_paid, paid, void, cancelled, overdue]
            example: sent
        - name: business_id
          in: query
          description: Optional business workspace ID (must be owned/member of)
          schema:
            type: integer
      responses:
        '200':
          description: Calculated financial metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Revenue report generated successfully
                  data:
                    $ref: '#/components/schemas/RevenueReport'
                  filters:
                    type: object
        '403':
          description: Attempted access to another user's business workspace
